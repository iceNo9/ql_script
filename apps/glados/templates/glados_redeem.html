<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>GLaDOS 礼品码兑换通知</title>
</head>
<body style="font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background-color:#f6f8fa; margin:0; padding:20px;">
    <h2 style="color:#333; text-align:center; margin-bottom:10px;">GLaDOS 礼品码兑换通知</h2>
    <p style="text-align:center; color:#555; margin-bottom:20px;">以下是本次礼品码兑换的详细信息：</p>

    <table style="width:100%; border-collapse:collapse; border:1px solid #ccc; background:#ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.05);">
        <tr>
            <th style="border:1px solid #ccc; padding:10px 12px; background-color:#2196F3; color:#fff;">账户</th>
            <th style="border:1px solid #ccc; padding:10px 12px; background-color:#2196F3; color:#fff;">礼品码</th>
            <th style="border:1px solid #ccc; padding:10px 12px; background-color:#2196F3; color:#fff;">天数</th>
            <th style="border:1px solid #ccc; padding:10px 12px; background-color:#2196F3; color:#fff;">状态</th>
            <th style="border:1px solid #ccc; padding:10px 12px; background-color:#2196F3; color:#fff;">信息</th>
            <th style="border:1px solid #ccc; padding:10px 12px; background-color:#2196F3; color:#fff;">邮件ID</th>
        </tr>
        {{ table_rows }}
    </table>

    <div style="text-align:center; font-size:12px; color:#888; margin-top:20px;">
        此邮件由系统自动发送，请勿回复。
    </div>
</body>
</html>
