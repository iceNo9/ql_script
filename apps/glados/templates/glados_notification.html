<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLaDOS 运行报告</title>
</head>
<body style="font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background-color:#f6f8fa; margin:0; padding:20px; color:#333; line-height:1.6;">
    
    <!-- 报告头部 -->
    <div style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; padding:25px 20px; border-radius:8px 8px 0 0; margin-bottom:20px; text-align:left;">
        <h1 style="margin:0 0 10px 0; font-size:26px; font-weight:700;">🎯 GLaDOS 运行报告</h1>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:14px; opacity:0.9;">报告时间：{{current_time}}</div>
            <div style="font-size:12px; background:rgba(255,255,255,0.2); padding:4px 10px; border-radius:4px;">
                报告ID: {{report_id}}
            </div>
        </div>
    </div>

    <!-- 账户信息部分 -->
    {{account_section}}

    <!-- 签到结果部分 -->
    {{checkin_section}}

    <!-- 礼品码兑换部分 -->
    {{code_section}}

    <!-- 蛋糕兑换部分 -->
    {{redeem_section}}

    <!-- 页脚 -->
    <div style="text-align:center; font-size:12px; color:#888; margin-top:30px; padding-top:20px; border-top:1px solid #e0e0e0;">
        <p style="margin:5px 0;">此报告由 GLaDOS 自动化系统生成 | 如有问题请联系系统管理员</p>
        <p style="margin:5px 0;">报告ID: <code style="background:#f5f5f5; padding:2px 6px; border-radius:3px;">{{report_id}}</code></p>
    </div>

</body>
</html>
